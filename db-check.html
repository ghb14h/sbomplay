<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB Diagnostic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>IndexedDB Diagnostic Tool</h1>
        <p class="text-muted">Check what data is stored in SBOM Play's IndexedDB</p>
        
        <button class="btn btn-primary mb-3" onclick="checkDatabase()">Check Database</button>
        <button class="btn btn-danger mb-3" onclick="clearDatabase()">Clear All Data</button>
        
        <div id="results" class="mt-4"></div>
    </div>

    <script src="js/storage-manager.js"></script>
    <script>
        async function checkDatabase() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="alert alert-info">Checking database...</div>';
            
            try {
                const storage = new StorageManager();
                await storage.init();
                
                // Get all data
                const orgs = await storage.getOrganizations();
                const singleRepos = await storage.getAllSingleRepoAnalyses();
                
                let html = '<div class="card">';
                html += '<div class="card-header"><h3>Database Contents</h3></div>';
                html += '<div class="card-body">';
                
                // Organizations
                html += `<h4>Organizations (${orgs.length})</h4>`;
                if (orgs.length > 0) {
                    html += '<ul class="list-group mb-4">';
                    for (const org of orgs) {
                        html += `<li class="list-group-item">`;
                        html += `<strong>${org.organization}</strong> - `;
                        html += `${org.summary?.totalRepositories || 0} repos, `;
                        html += `${org.allDependencies?.length || 0} dependencies`;
                        html += `<br><small class="text-muted">Timestamp: ${org.timestamp}</small>`;
                        html += `</li>`;
                    }
                    html += '</ul>';
                } else {
                    html += '<p class="text-muted">No organization analyses found</p>';
                }
                
                // Single Repos
                html += `<h4>Single Repositories (${singleRepos.length})</h4>`;
                if (singleRepos.length > 0) {
                    html += '<ul class="list-group mb-4">';
                    for (const repo of singleRepos) {
                        html += `<li class="list-group-item">`;
                        html += `<strong>${repo.owner}/${repo.name}</strong>`;
                        html += `<br>Dependencies: ${repo.sbomData?.allDependencies?.length || 0}`;
                        html += `<br>Vulnerabilities: ${repo.vulnerabilityAnalysis?.totalVulnerabilities || 0}`;
                        html += `<br>Licenses: ${repo.licenseAnalysis?.dependencies?.length || 0} analyzed`;
                        html += `<br><small class="text-muted">Timestamp: ${repo.timestamp}</small>`;
                        html += `<br><details><summary>Show Raw Data</summary><pre>${JSON.stringify(repo, null, 2)}</pre></details>`;
                        html += `</li>`;
                    }
                    html += '</ul>';
                } else {
                    html += '<p class="text-muted">No single repository analyses found</p>';
                }
                
                // Aggregated data check
                html += '<h4>Aggregated Data Test</h4>';
                const aggregated = await storage.getCombinedAggregatedData();
                if (aggregated) {
                    html += `<div class="alert alert-success">`;
                    html += `<strong>Aggregation works!</strong><br>`;
                    html += `Total repos: ${aggregated.statistics.totalRepositories}<br>`;
                    html += `Unique dependencies: ${aggregated.allDependencies?.length || 0}<br>`;
                    html += `Vulnerabilities: ${aggregated.vulnerabilityAnalysis?.totalVulnerabilities || 0}<br>`;
                    html += `Licenses analyzed: ${aggregated.licenseAnalysis?.dependencies?.length || 0}`;
                    html += `</div>`;
                } else {
                    html += '<div class="alert alert-warning">Aggregation returned null</div>';
                }
                
                html += '</div></div>';
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}<br><pre>${error.stack}</pre></div>`;
            }
        }
        
        async function clearDatabase() {
            if (!confirm('Are you sure you want to delete all stored data?')) {
                return;
            }
            
            try {
                const storage = new StorageManager();
                await storage.init();
                await storage.clearAllData();
                document.getElementById('results').innerHTML = '<div class="alert alert-success">All data cleared!</div>';
            } catch (error) {
                document.getElementById('results').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
